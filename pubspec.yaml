name: app_gs
description: "Aplicación Grupo Solsumed - Gestión de ventas y visitas"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.0

  # UI
  cupertino_icons: ^1.0.8
  fl_chart: ^0.68.0                      # Gráficos estadísticos
  flutter_launcher_icons: ^0.14.0        # Icono de la app
  
  # Red y API
  http: ^1.2.0                           # Peticiones HTTP
  webview_flutter: ^4.4.0                # Vista web
  cached_network_image: ^3.3.0           # Caché de imágenes
  
  # Almacenamiento
  shared_preferences: ^2.2.0             # Preferencias locales
  
  # Dispositivo
  mobile_scanner: ^5.0.0                 # Escáner QR
  geolocator: ^12.0.0                    # Ubicación GPS
  image_picker: ^1.2.1                   # Cámara y galería
  
  # Formato
  intl: ^0.18.0                          # Internacionalización y fechas

  sqflite: ^2.3.0                         # Base de datos SQLite
  path: ^1.8.0                            # Para rutas de archivos
  connectivity_plus: ^5.0.0               # Detectar conexión a internet
  uuid: ^4.5.0                            # UUID v4 para IDs locales

  flutter_map: ^6.1.0                     # Mapa basado en OpenStreetMap
  latlong2: ^0.9.0                        # Coordenadas
  workmanager: ^0.9.0+3                   # Sincronización en 2do plano al recuperar red (app cerrada)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0                  # Buenas prácticas de código

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"
  adaptive_icon_foreground: "assets/logo.png"